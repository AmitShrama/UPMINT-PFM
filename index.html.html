/* ============================================================
   AUREA — Premium Indian PFM
   Liquid-glass design system. Dark-first, light supported.
   All tunables are CSS vars set on :root (driven by Tweaks).
   ============================================================ */

:root {
  /* glass intensity (driven by tweak 0..100 -> these) */
  --glass-blur: 20px;
  --glass-sat: 175%;
  --glass-bg: rgba(255,255,255,0.06);
  --glass-bg-strong: rgba(255,255,255,0.10);
  --glass-border: rgba(255,255,255,0.14);
  --glass-hi: rgba(255,255,255,0.40);   /* top inset shine */
  --glass-lo: rgba(255,255,255,0.05);   /* bottom inset */
  --glass-shadow: 0 8px 30px rgba(0,0,0,0.40);

  /* ambient glow strength 0..1 */
  --glow: 0.7;

  /* accent (single interactive color) + aurora blobs */
  --accent: #6ea8fe;
  --accent-2: #34d399;
  --blob-a: #3b82f6;
  --blob-b: #34d399;
  --blob-c: #a78bfa;

  /* foreground / text */
  --bg: #08090c;
  --bg-2: #0c0e13;
  --fg: #f7f8fb;
  --fg-2: rgba(247,248,251,0.66);
  --fg-3: rgba(247,248,251,0.42);
  --hairline: rgba(255,255,255,0.09);

  /* semantic */
  --pos: #4ade80;
  --neg: #fb7185;
  --warn: #fbbf24;

  /* type */
  --font: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, system-ui, sans-serif;
  --num-feat: normal;        /* tabular-nums when set */
  --num-font: var(--font);   /* mono font for numerals when set */
  --radius: 26px;
}

/* ---------- Light theme ---------- */
.theme-light {
  --glass-bg: rgba(255,255,255,0.55);
  --glass-bg-strong: rgba(255,255,255,0.72);
  --glass-border: rgba(255,255,255,0.7);
  --glass-hi: rgba(255,255,255,0.95);
  --glass-lo: rgba(0,0,0,0.02);
  --glass-shadow: 0 8px 30px rgba(20,30,60,0.10);
  --bg: #eef0f5;
  --bg-2: #e6e9f0;
  --fg: #0c1018;
  --fg-2: rgba(12,16,24,0.62);
  --fg-3: rgba(12,16,24,0.40);
  --hairline: rgba(10,15,30,0.08);
  --pos: #16a34a;
  --neg: #e11d48;
  --warn: #d97706;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

.app-root {
  position: absolute; inset: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  isolation: isolate;
}

/* numerals */
.num { font-variant-numeric: var(--num-feat); font-family: var(--num-font); letter-spacing: -0.01em; }

/* ---------- Ambient aurora background ---------- */
.ambient { position: absolute; inset: -10%; z-index: 0; overflow: hidden; pointer-events: none; }
.ambient::after {
  /* subtle film grain / vignette */
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(120% 80% at 50% 0%, transparent 40%, rgba(0,0,0,0.45) 100%);
}
.theme-light .ambient::after {
  background: radial-gradient(120% 80% at 50% 0%, transparent 50%, rgba(120,130,160,0.12) 100%);
}
.blob {
  position: absolute; border-radius: 50%;
  filter: blur(60px);
  opacity: var(--glow);
  mix-blend-mode: screen;
  will-change: transform;
}
.theme-light .blob { mix-blend-mode: multiply; filter: blur(72px); opacity: calc(var(--glow) * 0.55); }
.blob.a { width: 340px; height: 340px; background: var(--blob-a); top: -60px; left: -40px; animation: drift1 18s ease-in-out infinite; }
.blob.b { width: 300px; height: 300px; background: var(--blob-b); top: 30%; right: -80px; animation: drift2 22s ease-in-out infinite; }
.blob.c { width: 280px; height: 280px; background: var(--blob-c); bottom: -40px; left: 10%; animation: drift3 26s ease-in-out infinite; }

@keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(40px,30px) scale(1.12)} }
@keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-50px,40px) scale(1.18)} }
@keyframes drift3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(30px,-30px) scale(1.1)} }
@media (prefers-reduced-motion: reduce){ .blob{ animation: none !important; } }

/* ---------- Glass surfaces ---------- */
.glass {
  position: relative;
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  border: 0.5px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--glass-shadow);
}
/* top shine + bottom inset, the "liquid" highlight */
.glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: inset 0 1px 0.5px var(--glass-hi), inset 0 -1px 0.5px var(--glass-lo);
}
.glass-strong { background: var(--glass-bg-strong); }
.glass-pill {
  position: relative; border-radius: 999px;
  background: var(--glass-bg-strong);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  border: 0.5px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
}
.glass-pill::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: inset 0 1px 0.5px var(--glass-hi);
}

/* specular sheen sweep used on hero cards */
.sheen { position: relative; overflow: hidden; }
.sheen::after {
  content: ""; position: absolute; top: -60%; left: -30%; width: 60%; height: 220%;
  background: linear-gradient(115deg, transparent, rgba(255,255,255,0.18), transparent);
  transform: rotate(8deg); animation: sweep 7s ease-in-out infinite;
  pointer-events: none;
}
@keyframes sweep { 0%,70%{ transform: translateX(-120%) rotate(8deg);} 100%{ transform: translateX(380%) rotate(8deg);} }
@media (prefers-reduced-motion: reduce){ .sheen::after{ animation: none; opacity: 0; } }

/* Safety: if entrance animations don't run (reduced motion / throttled tab),
   content must still be fully visible — never trapped at opacity 0. */
@media (prefers-reduced-motion: reduce){
  .screen-enter, .fade-enter, .rise { animation: none !important; opacity: 1 !important; transform: none !important; }
}
/* static render mode (verification / print) */
.snap .screen-enter, .snap .fade-enter, .snap .rise { animation: none !important; opacity: 1 !important; transform: none !important; }
.snap .blob { animation: none !important; }
.snap .sheen::after { animation: none !important; opacity: 0 !important; }

/* ---------- Scrolling ---------- */
.scroll { overflow-y: auto; overflow-x: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.scroll::-webkit-scrollbar { display: none; }

/* ---------- Buttons / chips ---------- */
.tap { cursor: pointer; transition: transform .18s cubic-bezier(.2,.8,.2,1), opacity .18s; user-select: none; }
.tap:active { transform: scale(0.965); opacity: 0.9; }

.btn-accent {
  background: linear-gradient(180deg, color-mix(in oklab, var(--accent) 92%, white), var(--accent));
  color: #05131f; font-weight: 650; border: none;
  box-shadow: 0 6px 20px color-mix(in oklab, var(--accent) 40%, transparent), inset 0 1px 0 rgba(255,255,255,0.5);
}
.theme-light .btn-accent { color: #04121e; }

/* ---------- Screen transitions ---------- */
.screen-enter { animation: screenIn .42s cubic-bezier(.2,.8,.2,1) both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(14px) scale(0.99);} to { opacity:1; transform:none; } }
.fade-enter { animation: fadeIn .5s ease both; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.rise { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from{opacity:0; transform: translateY(18px);} to{opacity:1; transform:none;} }

/* count-up shimmer for big numbers */
.lead-num { font-weight: 700; letter-spacing: -0.03em; }

/* sheet */
.sheet-backdrop { position: absolute; inset: 0; z-index: 80; background: rgba(0,0,0,0.45); backdrop-filter: blur(2px); animation: fadeIn .25s ease both; }
.theme-light .sheet-backdrop { background: rgba(30,40,70,0.28); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 81; animation: sheetUp .42s cubic-bezier(.2,.85,.2,1) both; }
@keyframes sheetUp { from { transform: translateY(100%);} to { transform: none; } }

/* tab bar */
.tabbar { position: absolute; left: 14px; right: 14px; bottom: 12px; z-index: 40; }

/* segmented */
.seg { position: relative; display: flex; padding: 3px; border-radius: 999px; }
.seg-pill { position: absolute; top: 3px; bottom: 3px; border-radius: 999px; background: var(--glass-bg-strong); border:0.5px solid var(--glass-border); box-shadow: 0 2px 8px rgba(0,0,0,0.25); transition: left .32s cubic-bezier(.3,.8,.2,1), width .32s cubic-bezier(.3,.8,.2,1); }

.divider { height: 0.5px; background: var(--hairline); border: none; margin: 0; }

.kpi-up { color: var(--pos); }
.kpi-down { color: var(--neg); }

    html, body { margin: 0; height: 100%; background: #050507; overflow: hidden; }
    #root { position: fixed; inset: 0; }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>

// smooth path from points (Catmull-Rom -> bezier)
function smoothPath(pts) {
  if (pts.length < 2) return '';
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6;
    const c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6;
    const c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2[0]} ${p2[1]}`;
  }
  return d;
}

// Area + line chart with gradient fill and grow animation
function AreaChart({ data, w = 320, h = 120, color = 'var(--accent)', pad = 6, showDot = true, strokeW = 2.5, fillOpacity = 0.22 }) {
  const id = React.useMemo(() => 'g' + Math.random().toString(36).slice(2, 7), []);
  const min = Math.min(...data), max = Math.max(...data);
  const span = max - min || 1;
  const innerW = w - pad * 2, innerH = h - pad * 2;
  const pts = data.map((v, i) => [
    pad + (i / (data.length - 1)) * innerW,
    pad + innerH - ((v - min) / span) * innerH,
  ]);
  const line = smoothPath(pts);
  const area = `${line} L ${pts[pts.length - 1][0]} ${h - pad} L ${pts[0][0]} ${h - pad} Z`;
  const last = pts[pts.length - 1];
  const [len, setLen] = React.useState(0);
  const ref = React.useRef(null);
  React.useEffect(() => { if (ref.current) setLen(ref.current.getTotalLength()); }, [data, w, h]);
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ overflow: 'visible' }}>
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity={fillOpacity} />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#${id})`} className="fade-enter" />
      <path ref={ref} d={line} fill="none" stroke={color} strokeWidth={strokeW}
        strokeLinecap="round"
        style={{ strokeDasharray: len, strokeDashoffset: len, animation: len ? 'draw 1.3s cubic-bezier(.3,.8,.2,1) forwards' : 'none' }} />
      {showDot && (
        <>
          <circle cx={last[0]} cy={last[1]} r="8" fill={color} opacity="0.18" />
          <circle cx={last[0]} cy={last[1]} r="3.5" fill={color} stroke="#fff" strokeWidth="1.5" />

      <style>{`@keyframes draw { to { stroke-dashoffset: 0; } }`}</style>
    </svg>
  );
}

// tiny sparkline
function Spark({ data, w = 64, h = 24, color = 'var(--pos)', up = true }) {

  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <path d={smoothPath(pts)} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" />

  );

// weekly bars
function BarWeek({ data, w = 320, h = 120, color = 'var(--accent)', labels }) {
  const max = Math.max(...data) || 1;
  const n = data.length;
  const gap = 12;
  const bw = (w - gap * (n - 1)) / n;
  return (
    <svg width={w} height={h + 18} viewBox={`0 0 ${w} ${h + 18}`}>
      {data.map((v, i) => {
        const bh = Math.max(4, (v / max) * h);
        const x = i * (bw + gap);
        const isMax = v === max;
        return (
          <g key={i}>
            <rect x={x} y={h - bh} width={bw} height={bh} rx={Math.min(bw / 2, 8)}
              fill={isMax ? color : 'var(--glass-border)'}
              style={{ transformOrigin: `${x + bw / 2}px ${h}px`, animation: `barGrow .7s cubic-bezier(.2,.8,.2,1) ${i * 0.05}s both` }} />
            {labels && <text x={x + bw / 2} y={h + 13} textAnchor="middle" fontSize="9.5" fill="var(--fg-3)">{labels[i]}</text>}

    </svg>
  );

// donut / ring chart from segments [{value,color}]
function Donut({ segments, size = 150, thickness = 18, gap = 0.04, children }) {
  const r = (size - thickness) / 2;

    <div style={{ position: 'relative', width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>

          const dash = Math.max(0, frac * c - gap * c);
          const off = -acc * c;
          acc += frac;
          return (
            <circle key={i} cx={size / 2} cy={size / 2} r={r} fill="none"
              stroke={s.color} strokeWidth={thickness} strokeLinecap="round"
              strokeDasharray={`${dash} ${c - dash}`} strokeDashoffset={off}

  return (
    <div style={{ position: 'relative', width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: `rotate(${90 + (360 - sweep) / 2}deg)` }}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={track} strokeWidth={thickness}
          strokeLinecap="round" strokeDasharray={`${arc} ${circ - arc}`} />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={thickness}
          strokeLinecap="round" strokeDasharray={`${arc * frac} ${circ - arc * frac}`}
          style={{ animation: `gauge 1.4s cubic-bezier(.2,.8,.2,1) forwards`, filter: `drop-shadow(0 0 6px color-mix(in oklab, ${color} 60%, transparent))` }} />
        <style>{`@keyframes gauge { from { stroke-dasharray: 0 ${circ}; } }`}</style>
      </svg>
      {children && <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>{children}</div>}
    </div>

// linear progress
function Bar({ pct, color = 'var(--accent)', h = 8, track = 'var(--glass-border)', delay = 0 }) {
  return (
    <div style={{ height: h, borderRadius: 999, background: track, overflow: 'hidden', width: '100%' }}>
      <div style={{ height: '100%', borderRadius: 999, background: color, width: Math.min(100, pct) + '%',
        boxShadow: `0 0 8px color-mix(in oklab, ${color} 55%, transparent)`,
        animation: `grow .9s cubic-bezier(.2,.8,.2,1) ${delay}s both` }} />

  const reduce = (typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches) || (typeof window !== 'undefined' && window.__snap);

  React.useEffect(() => {
    if (reduce) { setV(target); return; }
    let raf, t0;
    const ease = (x) => 1 - Math.pow(1 - x, 3);

    setRefreshing(true);
    setTimeout(() => { setRefreshing(false); setSynced('just now'); }, 1300);

  const onLinked = (banks) => {
    const added = banks.map((b) => ({ ...b, consent: { status: 'Active', id: 'CNS-' + b.logo + '-' + b.mask, fip: b.bank, expiry: '30 May 2027', granted: '30 May 2026', frequency: 'Up to 2×/day', dataTypes: ['Profile', 'Summary', 'Transactions'], purpose: 'Wealth aggregation & analytics' } }));

        </div>

          {liveAccts.map((a) => (

              <span className="num" style={{ fontSize: 12, fontWeight: 600 }}>{A.compactINR(a.balance)}</span>
            </div>
          ))}
        </div>
      </GlassCard>

      <SectionHeader title="Linked accounts" />
      {staleAccts.length > 0 && (
        <GlassCard pad={14} onClick={() => setManage(staleAccts[0].id)} style={{ marginBottom: 11, border: '1px solid color-mix(in oklab, var(--warn) 50%, transparent)', background: 'color-mix(in oklab, var(--warn) 12%, var(--glass-bg))' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <CatIcon icon="warn" color="var(--warn)" size={38} radius={11} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 13.5, fontWeight: 680, color: 'var(--warn)', letterSpacing: '0.02em' }}>SYNC NOW</div>
              <div style={{ fontSize: 12, color: 'var(--fg-2)', marginTop: 2 }}>{staleAccts[0].bank} ••{staleAccts[0].mask} consent expires {staleAccts[0].consent.expiry}</div>
            </div>
            <div className="tap" style={{ fontSize: 12.5, fontWeight: 620, color: 'var(--warn)', padding: '7px 13px', borderRadius: 999, border: '1px solid color-mix(in oklab, var(--warn) 50%, transparent)' }}>Renew</div>
          </div>
        </GlassCard>
      )}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 11 }}>
        {liveAccts.map((a) => {
          const sm = statusMeta(a.consent.status);
          const paused = a.consent.status === 'Revoked';
          return (
            <GlassCard key={a.id} pad={15}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 13 }}>
                <div className="tap" onClick={() => !paused && nav('transactions')} style={{ display: 'flex', alignItems: 'center', gap: 13, flex: 1, minWidth: 0, opacity: paused ? 0.55 : 1 }}>
                  <BankBadge code={a.logo} accent={a.accent} size={44} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 15, fontWeight: 620 }}>{a.bank}</div>

                    <Amount value={a.balance} size={16.5} weight={680} />
                    <div style={{ fontSize: 11, color: sm.c, marginTop: 2, display: 'flex', alignItems: 'center', gap: 3, justifyContent: 'flex-end' }}>
                      <span style={{ width: 6, height: 6, borderRadius: 999, background: sm.c }} /> {paused ? 'Sync paused' : 'Live'}
                    </div>
                  </div>

              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 12, paddingTop: 12, borderTop: '0.5px solid var(--hairline)' }}>
                <div style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '4px 9px', borderRadius: 999, fontSize: 11, fontWeight: 600, color: sm.c, background: `color-mix(in oklab, ${sm.c} 15%, transparent)` }}>
                  <Icon name="shield" size={12} /> Consent {sm.label}
                </div>
                <div style={{ flex: 1 }} />
                <div className="tap" onClick={() => setManage(a.id)} style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 12.5, fontWeight: 600, color: 'var(--accent)' }}>
                  Manage consent <Icon name="chevron" size={14} stroke={2.2} />
                </div>
              </div>
            </GlassCard>
          );
        })}
        <GlassCard pad={15} onClick={() => setLinking(true)} style={{ borderStyle: 'dashed' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 13, color: 'var(--fg-2)' }}>
            <div className="glass-pill" style={{ width: 44, height: 44, display: 'grid', placeItems: 'center' }}><Icon name="plus" size={20} style={{ color: 'var(--accent)' }} /></div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 15, fontWeight: 600, color: 'var(--fg)' }}>Link another account</div>

      {linking && <AALinkFlow existingCount={accts.length} onClose={() => setLinking(false)} onLinked={onLinked} />}
      <style>{`@keyframes sp{to{transform:rotate(360deg)}}`}</style>
    </div>
  );
}

function ConsentSheet({ account, onClose, onRevoke, onReactivate, onRemove }) {
  const A = window.AUREA;
  const c = account.consent;
  const paused = c.status === 'Revoked';
  const [view, setView] = React.useState('details'); // details | finvu | revoked | removeConfirm
  const sm = c.status === 'Active' ? { col: 'var(--pos)', label: 'Active' }
    : c.status === 'Expiring' ? { col: 'var(--warn)', label: 'Expiring soon' }
    : { col: 'var(--neg)', label: 'Paused' };

  // mock Finvu webview revoke flow
  const [finvuStep, setFinvuStep] = React.useState('confirm'); // confirm | processing | done
  const runRevoke = () => {
    setFinvuStep('processing');
    setTimeout(() => setFinvuStep('done'), 1300);
    setTimeout(() => { onRevoke(); setView('details'); setFinvuStep('confirm'); }, 2200);
  };

  if (view === 'finvu') return (
    <Sheet title="Finvu · Consent" onClose={() => { setView('details'); setFinvuStep('confirm'); }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '4px 0 14px', fontSize: 11.5, color: 'var(--fg-3)' }}>
        <Icon name="lock" size={13} /> Secure Finvu AA webview · finvu.in

          <>
            <div style={{ width: 60, height: 60, borderRadius: 16, display: 'grid', placeItems: 'center', background: 'color-mix(in oklab, var(--neg) 16%, transparent)', border: '1px solid color-mix(in oklab, var(--neg) 38%, transparent)' }}>
              <Icon name="shield" size={30} color="var(--neg)" />
            </div>
            <div style={{ fontSize: 16, fontWeight: 680 }}>Revoke this consent?</div>
            <div style={{ fontSize: 13, color: 'var(--fg-2)', lineHeight: 1.5, textWrap: 'pretty' }}>AUREA will stop fetching data from {account.bank} ••{account.mask}. Existing data stays until you remove the account.</div>
            <div style={{ display: 'flex', gap: 10, width: '100%', marginTop: 4 }}>
              <div className="tap glass" onClick={() => { setView('details'); }} style={{ flex: 1, padding: '12px', borderRadius: 13, textAlign: 'center', fontSize: 14, fontWeight: 580 }}>Cancel</div>
              <div className="tap" onClick={runRevoke} style={{ flex: 1, padding: '12px', borderRadius: 13, textAlign: 'center', fontSize: 14, fontWeight: 620, color: '#fff', background: 'var(--neg)' }}>Revoke</div>
            </div>
          </>
        )}
        {finvuStep === 'processing' && (
          <>
            <div className="spin" style={{ width: 44, height: 44, borderRadius: 999, border: '3px solid var(--glass-border)', borderTopColor: 'var(--accent)' }} />
            <div style={{ fontSize: 14, color: 'var(--fg-2)' }}>Revoking via Finvu…</div>
            <style>{`@keyframes sp{to{transform:rotate(360deg)}} .spin{animation:sp .8s linear infinite}`}</style>
          </>
        )}
        {finvuStep === 'done' && (
          <>
            <div style={{ width: 60, height: 60, borderRadius: 999, display: 'grid', placeItems: 'center', background: 'color-mix(in oklab, var(--pos) 18%, transparent)', border: '1px solid color-mix(in oklab, var(--pos) 40%, transparent)' }}>
              <Icon name="check" size={32} color="var(--pos)" stroke={2.4} />
            </div>
            <div style={{ fontSize: 16, fontWeight: 680 }}>Consent revoked</div>
            <div style={{ fontSize: 13, color: 'var(--fg-3)' }}>Sync paused for this account</div>
          </>
        )}
      </div>
    </Sheet>
  );

  if (view === 'removeConfirm') return (
    <Sheet title="Remove account" onClose={() => setView('details')}>
      <div style={{ textAlign: 'center', padding: '8px 6px 4px' }}>
        <div style={{ width: 64, height: 64, margin: '0 auto 14px', borderRadius: 18, display: 'grid', placeItems: 'center', background: 'color-mix(in oklab, var(--neg) 14%, transparent)', border: '1px solid color-mix(in oklab, var(--neg) 36%, transparent)' }}>
          <Icon name="back" size={30} color="var(--neg)" />
        </div>
        <div style={{ fontSize: 19, fontWeight: 700 }}>Remove {account.bank}?</div>
        <div style={{ fontSize: 14, color: 'var(--fg-2)', lineHeight: 1.55, marginTop: 8, textWrap: 'pretty' }}>This removes ••{account.mask} and all its fetched data from your dashboard. You can re-link it anytime via the Account Aggregator.</div>
        <div className="tap" onClick={onRemove} style={{ marginTop: 20, padding: '14px', borderRadius: 14, fontSize: 15, fontWeight: 620, color: '#fff', background: 'var(--neg)' }}>Remove from dashboard</div>
        <div className="tap glass" onClick={() => setView('details')} style={{ marginTop: 10, padding: '13px', borderRadius: 14, fontSize: 14.5, fontWeight: 580 }}>Keep account</div>
      </div>
    </Sheet>
  );

  // details
  const rows = [
    ['Consent ID', c.id],
    ['Account Aggregator', 'Finvu'],
    ['FIP (data provider)', c.fip],
    ['Purpose', c.purpose],
    ['Data accessed', c.dataTypes.join(' · ')],

  return (
    <Sheet title="Manage consent" onClose={onClose}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 14 }}>
        <BankBadge code={account.logo} accent={account.accent} size={46} />

          <div style={{ fontSize: 12.5, color: 'var(--fg-3)' }}>{account.type} · ••{account.mask}</div>

        <div style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '5px 11px', borderRadius: 999, fontSize: 12, fontWeight: 620, color: sm.col, background: `color-mix(in oklab, ${sm.col} 15%, transparent)` }}>

        {rows.map(([k, v], i) => (
          <div key={k} style={{ display: 'flex', justifyContent: 'space-between', gap: 14, padding: '11px 12px', borderBottom: i === rows.length - 1 ? 'none' : '0.5px solid var(--hairline)' }}>
            <span style={{ fontSize: 12.5, color: 'var(--fg-3)', flexShrink: 0 }}>{k}</span>
            <span className="num" style={{ fontSize: 12.5, fontWeight: 560, textAlign: 'right' }}>{v}</span>
          </div>
        ))}
      </GlassCard>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        {!paused ? (
          <div className="tap glass" onClick={() => { setView('finvu'); setFinvuStep('confirm'); }} style={{ padding: '14px 16px', borderRadius: 14, display: 'flex', alignItems: 'center', gap: 12, color: 'var(--neg)' }}>
            <Icon name="shield" size={20} />
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 14.5, fontWeight: 620 }}>Revoke consent</div>
              <div style={{ fontSize: 12, color: 'var(--fg-3)', marginTop: 1 }}>Pauses sync · via Finvu webview</div>
            </div>
            <Icon name="chevron" size={17} style={{ color: 'var(--fg-3)' }} />
          </div>
        ) : (
          <div className="tap glass" onClick={onReactivate} style={{ padding: '14px 16px', borderRadius: 14, display: 'flex', alignItems: 'center', gap: 12, color: 'var(--pos)' }}>
            <Icon name="check" size={20} stroke={2.2} />
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 14.5, fontWeight: 620 }}>Reactivate consent</div>
              <div style={{ fontSize: 12, color: 'var(--fg-3)', marginTop: 1 }}>Resume secure data sync</div>
            </div>
            <Icon name="chevron" size={17} style={{ color: 'var(--fg-3)' }} />
          </div>
        )}
        <div className="tap glass" onClick={() => setView('removeConfirm')} style={{ padding: '14px 16px', borderRadius: 14, display: 'flex', alignItems: 'center', gap: 12, color: 'var(--fg-2)' }}>
          <Icon name="back" size={20} />
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 14.5, fontWeight: 620, color: 'var(--fg)' }}>Remove from dashboard</div>
            <div style={{ fontSize: 12, color: 'var(--fg-3)', marginTop: 1 }}>Delete account & its data</div>
          </div>
          <Icon name="chevron" size={17} style={{ color: 'var(--fg-3)' }} />
        </div>
      </div>
    </Sheet>
  );
}

function OtpKeypad({ otp, setOtp, len = 6 }) {
  const pad = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'];
  const press = (k) => {
    if (k === 'del') setOtp(otp.slice(0, -1));
    else if (k !== '' && otp.length < len) setOtp(otp + k);
  };
  return (
    <>
      <div style={{ display: 'flex', gap: 9, justifyContent: 'center', margin: '4px 0 18px' }}>
        {Array.from({ length: len }).map((_, i) => (
          <div key={i} className="glass" style={{ width: 42, height: 52, borderRadius: 13, display: 'grid', placeItems: 'center', fontSize: 22, fontWeight: 700, border: otp.length === i ? '1.5px solid var(--accent)' : undefined }}>
            {otp[i] ? '•' : ''}
          </div>
        ))}
      </div>
      <div className="tap" onClick={() => setOtp('248913')} style={{ textAlign: 'center', fontSize: 12.5, color: 'var(--accent)', fontWeight: 560, marginBottom: 14 }}>Autofill demo OTP</div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 8 }}>
        {pad.map((k, i) => k === '' ? <div key={i} /> : (
          <div key={i} className="tap glass" style={{ padding: '13px 0', textAlign: 'center', fontSize: 21, fontWeight: 600, borderRadius: 14 }} onClick={() => press(k)}>
            {k === 'del' ? <Icon name="back" size={19} style={{ margin: '0 auto', color: 'var(--fg-2)' }} /> : k}
          </div>
        ))}
      </div>
    </>
  );
}

function txIcon(t) {
  if (t.amt > 0) return { icon: 'income', color: 'var(--pos)' };
  return { icon: t.icon, color: t.color === '#000000' ? 'var(--fg)' : t.color };
}

  <script type="text/babel">
/* AUREA — Aurea AI advisor chat. */

const AI_GREETING = "Hi Aarav 👋 I'm Aurea — your private finance copilot. I've analysed your accounts, spends and investments. What would you like to know?";

const AI_SUGGEST = [
  'How can I save more tax?',
  'Where did my money go in May?',
  'Am I on track for my goals?',
  'Should I increase my SIP?',
];

function aiReply(q) {
  const A = window.AUREA;
  const k = q.toLowerCase();
  if (k.includes('tax') || k.includes('80c'))
    return { text: "You've used ₹1.03L of your ₹1.5L 80C limit. Topping up ₹46,800 — say into your Parag Parikh ELSS or PPF — would save you about ₹14,600 in tax at your 31.2% slab. Want me to set up a one-time investment?",
      widget: { type: 'stat', items: [{ l: '80C left', v: '₹46,800', c: 'var(--warn)' }, { l: 'Tax saved', v: '₹14,600', c: 'var(--pos)' }] } };
  if (k.includes('money') || k.includes('spend') || k.includes('may') || k.includes('go'))
    return { text: "In May you spent ₹1,68,400 — about 9% more than April. Rent and dining were the biggest movers. Dining alone is up 38% across 28 UPI orders. You're still ₹31,600 under budget though 👍",
      widget: { type: 'cats' } };
  if (k.includes('goal') || k.includes('track'))
    return { text: "You're ahead on 3 of 4 goals. Your Europe Trip is 80% funded and your Emergency Fund is fully done. The Goa Villa goal needs ~₹14,000/mo more to hit Dec 2027 — shall I automate it?",
      widget: { type: 'goals' } };
  if (k.includes('sip') || k.includes('invest'))
    return { text: "Your SIPs are doing well at 18.4% XIRR. You have ₹2.4L sitting idle in savings. Redirecting ₹15,000/mo of it into your index + flexi-cap mix could add roughly ₹38L over 15 years at 12% — without touching your lifestyle.",
      widget: { type: 'stat', items: [{ l: 'Current XIRR', v: '18.4%', c: 'var(--pos)' }, { l: 'Idle cash', v: '₹2.4L', c: 'var(--accent)' }] } };
  return { text: "Good question. Based on your current cashflow you're saving about 41% of your income — well above the 30% benchmark for your bracket. Keep it up, and consider moving idle savings into a liquid fund for ~6.8% returns." };
}

function AIWidget({ w }) {
  const A = window.AUREA;
  if (w.type === 'stat') return (
    <div style={{ display: 'flex', gap: 10, marginTop: 10 }}>
      {w.items.map((it, i) => (
        <div key={i} className="glass" style={{ flex: 1, padding: '11px 13px', borderRadius: 14 }}>
          <div style={{ fontSize: 11, color: 'var(--fg-3)' }}>{it.l}</div>
          <div className="num" style={{ fontSize: 18, fontWeight: 720, color: it.c, marginTop: 2 }}>{it.v}</div>
        </div>
      ))}

  if (w.type === 'cats') return (
    <div className="glass" style={{ padding: 13, borderRadius: 14, marginTop: 10, display: 'flex', flexDirection: 'column', gap: 9 }}>
      {A.spend.categories.slice(0, 4).map((c) => (

  if (w.type === 'goals') return (
    <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>

        const pct = Math.min(100, Math.round((g.saved / g.target) * 100));

          <div key={g.id} className="glass" style={{ flex: 1, padding: 11, borderRadius: 14, textAlign: 'center' }}>

          </div>
        );
      })}

  );
  return null;
}

function AIScreen({ nav }) {
  const A = window.AUREA;
  const [msgs, setMsgs] = React.useState([{ role: 'ai', text: AI_GREETING }]);
  const [typing, setTyping] = React.useState(false);
  const [input, setInput] = React.useState('');
  const scrollRef = React.useRef(null);
  React.useEffect(() => { const el = scrollRef.current; if (el) el.scrollTop = el.scrollHeight; }, [msgs, typing]);

  const ask = (q) => {
    if (!q.trim()) return;
    setMsgs((m) => [...m, { role: 'user', text: q }]);

    setTimeout(() => {
      const r = aiReply(q);

          </div>
        </div>
      </div>

      <div ref={scrollRef} className="scroll" style={{ flex: 1, overflowY: 'auto', padding: '6px 16px 12px', display: 'flex', flexDirection: 'column', gap: 12 }}>
        {msgs.map((m, i) => (
          <div key={i} className="rise" style={{ alignSelf: m.role === 'user' ? 'flex-end' : 'flex-start', maxWidth: '88%' }}>
            <div className={m.role === 'ai' ? 'glass' : ''} style={{
              padding: '12px 15px', borderRadius: m.role === 'user' ? '18px 18px 5px 18px' : '5px 18px 18px 18px',
              fontSize: 14, lineHeight: 1.5, letterSpacing: '-0.01em',
              background: m.role === 'user' ? 'var(--accent)' : undefined,
              color: m.role === 'user' ? '#05131f' : 'var(--fg)',
              fontWeight: m.role === 'user' ? 540 : 440,
            }}>
              {m.text}
              {m.widget && <AIWidget w={m.widget} />}
            </div>
          </div>
        ))}
        {typing && (
          <div className="glass" style={{ alignSelf: 'flex-start', padding: '14px 16px', borderRadius: '5px 18px 18px 18px', display: 'flex', gap: 5 }}>
            {[0, 1, 2].map((i) => <span key={i} style={{ width: 7, height: 7, borderRadius: 999, background: 'var(--fg-3)', animation: `blink 1.2s ease-in-out ${i * 0.18}s infinite` }} />)}
          </div>
        )}
        {msgs.length <= 1 && !typing && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginTop: 4 }}>
            {AI_SUGGEST.map((s) => (
              <div key={s} className="tap glass" onClick={() => ask(s)} style={{ padding: '12px 15px', borderRadius: 14, fontSize: 13.5, fontWeight: 540, display: 'flex', alignItems: 'center', gap: 9, color: 'var(--fg-2)' }}>
                <Icon name="sparkles" size={16} style={{ color: 'var(--accent)' }} /> {s}
              </div>
            ))}
          </div>
        )}

      <div style={{ padding: '8px 16px 96px' }}>
        <div className="glass" style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 6px 6px 16px', borderRadius: 999 }}>

      <style>{`@keyframes blink { 0%,100%{opacity:.3;transform:translateY(0)} 50%{opacity:1;transform:translateY(-2px)} }`}</style>
    </div>
  );
}

  const savingsRate = Math.round((savings / income) * 100);
  const days = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  return (
    <div className="scroll screen-enter" style={{ position: 'absolute', inset: 0, padding: '54px 16px 108px', overflowY: 'auto' }}>

        <GlassCard pad={16}>

        </GlassCard>
      </div>

      <GlassCard strong pad={18} style={{ marginBottom: 14 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div>
            <div style={{ fontSize: 13, color: 'var(--fg-3)' }}>Savings rate</div>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginTop: 2 }}>
              <span className="num" style={{ fontSize: 30, fontWeight: 760 }}>{savingsRate}%</span>
              <Amount value={savings} size={14} weight={620} color="var(--pos)" />

          <div style={{ width: 72, height: 72 }}>
            <Gauge value={savingsRate} max={100} size={72} thickness={9} color="var(--pos)" sweep={360}>
              <Icon name="fire" size={22} color="var(--pos)" />
            </Gauge>
          </div>
        </div>
        <div style={{ fontSize: 12, color: 'var(--fg-2)', marginTop: 6, lineHeight: 1.45 }}>You saved <b>{A.compactINR(savings)}</b> this month — above the 30% benchmark for your bracket.</div>
      </GlassCard>

      <GlassCard pad={18} style={{ marginBottom: 14 }}>
        <SectionHeader title="Where it went" />
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <Donut segments={s.categories} size={138} thickness={16}>
            <Amount value={s.total} compact size={16} weight={740} />
            <div style={{ fontSize: 10, color: 'var(--fg-3)' }}>{month} spend</div>
          </Donut>
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 8 }}>
            {s.categories.slice(0, 5).map((c) => (
              <div key={c.label} style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
                <span style={{ width: 8, height: 8, borderRadius: 2, background: c.color, flexShrink: 0 }} />
                <span style={{ fontSize: 11.5, color: 'var(--fg-2)', flex: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{c.label}</span>
                <span style={{ fontSize: 11, color: 'var(--fg-3)' }}>{Math.round(c.value / s.total * 100)}%</span>
              </div>
            ))}
          </div>
        </div>
      </GlassCard>

      <GlassCard pad={18} style={{ marginBottom: 14 }}>
        <SectionHeader title="UPI spend · last 7 days" />
        <BarWeek data={s.week} w={320} h={110} labels={days} />
        <div style={{ fontSize: 12, color: 'var(--fg-3)', marginTop: 6 }}>Avg <span className="num" style={{ color: 'var(--fg)', fontWeight: 600 }}>{A.fmtINR(Math.round(s.week.reduce((a, b) => a + b) / 7))}</span>/day · peak on Saturday</div>
      </GlassCard>

      <SectionHeader title="All categories" />
      <GlassCard pad={16}>
        {s.categories.map((c, i) => (
          <Row key={c.label} last={i === s.categories.length - 1}
            left={<CatIcon icon={c.icon} color={c.color} size={38} />}
            title={c.label} sub={`${Math.round(c.value / s.total * 100)}% of spend`}
            right={<Amount value={c.value} size={15} weight={650} />} />
        ))}
      </GlassCard>
    </div>
  );
}

Object.assign(window, { GoalsScreen, AnalyticsScreen });

  <script type="text/babel">
/* AUREA — app shell: routing, custom device frame, tab bar, tweaks, scaling. */

const ACCENTS = {
  Aurora:   { accent: '#6ea8fe', accent2: '#34d399', a: '#3b82f6', b: '#34d399', c: '#a78bfa' },
  Emerald:  { accent: '#34d399', accent2: '#5eead4', a: '#10b981', b: '#34d399', c: '#2dd4bf' },
  Electric: { accent: '#5b9dff', accent2: '#7dd3fc', a: '#3b82f6', b: '#0ea5e9', c: '#6366f1' },
  Gold:     { accent: '#e3c08d', accent2: '#fbbf24', a: '#d4a25a', b: '#f59e0b', c: '#eab308' },
};
const FONTS = {
  System: '-apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, system-ui, sans-serif',
  Manrope: '"Manrope", -apple-system, system-ui, sans-serif',
  Sora: '"Sora", -apple-system, system-ui, sans-serif',
};

if (typeof location !== 'undefined' && location.hash.indexOf('static') >= 0) {
  window.__snap = true;
  document.documentElement.classList.add('snap');
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "Aurora",
  "glass": 70,
  "glow": 70,
  "font": "System",
  "numerals": "Clean",
  "dark": true
}/*EDITMODE-END*/;

const TABS = [
  { id: 'home', icon: 'home', label: 'Home' },
  { id: 'accounts', icon: 'wallet', label: 'Money' },
  { id: 'ai', icon: 'sparkles', label: 'Aurea', center: true },
  { id: 'invest', icon: 'invest', label: 'Invest' },
  { id: 'profile', icon: 'user', label: 'Profile' },
];
const TAB_GROUP = {
  home: ['home', 'goals', 'analytics', 'notifs'],
  accounts: ['accounts', 'transactions', 'cards'],
  invest: ['invest', 'cibil'],
  ai: ['ai'], profile: ['profile'],
};

function StatusBar({ dark }) {
  const c = dark ? '#fff' : '#0c1018';
  return (
    <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 54, zIndex: 30, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 30px', pointerEvents: 'none' }}>
      <span style={{ fontSize: 16, fontWeight: 640, color: c, letterSpacing: '0.01em', marginTop: 4 }}>9:41</span>
      <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginTop: 4 }}>
        <svg width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="6.5" width="3" height="4.5" rx="0.7" fill={c}/><rect x="4.5" y="4.5" width="3" height="6.5" rx="0.7" fill={c}/><rect x="9" y="2.3" width="3" height="8.7" rx="0.7" fill={c}/><rect x="13.5" y="0" width="3" height="11" rx="0.7" fill={c}/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill={c}><path d="M8 2.7c2 0 3.9.8 5.3 2.1l1-1A9 9 0 0 0 8 1.1 9 9 0 0 0 1.7 3.8l1 1A7.5 7.5 0 0 1 8 2.7Z"/><path d="M8 6c1 0 2 .4 2.7 1.1l1-1A6 6 0 0 0 8 4.3a6 6 0 0 0-3.7 1.8l1 1A4.5 4.5 0 0 1 8 6Z"/><circle cx="8" cy="9.3" r="1.3"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke={c} strokeOpacity="0.4" fill="none"/><rect x="2" y="2" width="18" height="8" rx="1.6" fill={c}/><path d="M23 4v4c.8-.3 1.3-1 1.3-2S23.8 4.3 23 4Z" fill={c} fillOpacity="0.5"/></svg>
      </div>
    </div>
  );
}

function Frame({ dark, children }) {
  return (
    <div style={{
      width: 402, height: 874, borderRadius: 54, position: 'relative', overflow: 'hidden',
      background: dark ? '#05060a' : '#eef0f5',
      boxShadow: '0 50px 110px rgba(0,0,0,0.55), 0 0 0 2px rgba(255,255,255,0.06), 0 0 0 11px #15161a, 0 0 0 13px #303237, 0 0 0 14px rgba(0,0,0,0.6)',
    }}>
      {children}
      <div style={{ position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)', width: 124, height: 36, borderRadius: 22, background: '#000', zIndex: 40 }} />
      <StatusBar dark={dark} />
      <div style={{ position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)', width: 138, height: 5, borderRadius: 999, background: dark ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.32)', zIndex: 45, pointerEvents: 'none' }} />
    </div>
  );
}

function TabBar({ active, nav }) {
  const grp = (id) => TAB_GROUP[id].includes(active);
  return (
    <div className="tabbar">
      <div className="glass glass-strong" style={{ borderRadius: 28, padding: 8, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        {TABS.map((t) => {
          const on = grp(t.id);
          if (t.center) return (
            <div key={t.id} className="tap" onClick={() => nav(t.id)} style={{ flex: 1, display: 'grid', placeItems: 'center' }}>
              <div className="sheen" style={{ width: 52, height: 52, borderRadius: 17, marginTop: -22, background: 'linear-gradient(145deg, var(--blob-a), var(--blob-c))', display: 'grid', placeItems: 'center', boxShadow: '0 8px 22px color-mix(in oklab, var(--accent) 55%, transparent), inset 0 1px 0 rgba(255,255,255,0.4)', transform: on ? 'scale(1.04)' : 'none', transition: 'transform .2s' }}>
                <Icon name="sparkles" size={26} color="#fff" />
              </div>
            </div>
          );
          return (
            <div key={t.id} className="tap" onClick={() => nav(t.id)} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, padding: '4px 0', color: on ? 'var(--accent)' : 'var(--fg-3)', transition: 'color .2s' }}>
              <Icon name={t.icon} size={23} stroke={on ? 2.1 : 1.8} />
              <span style={{ fontSize: 9.5, fontWeight: on ? 640 : 540 }}>{t.label}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [phase, setPhase] = React.useState(typeof location !== 'undefined' && location.hash.indexOf('app') >= 0 ? 'app' : 'splash');
  const [tab, setTab] = React.useState('home');
  const [sheet, setSheet] = React.useState(null);
  const [hideBal, setHideBal] = React.useState(false);
  const [scale, setScale] = React.useState(1);
  const rootRef = React.useRef(null);

  const theme = t.dark ? 'dark' : 'light';
  const toggleTheme = () => setTweak('dark', !t.dark);

  React.useEffect(() => {
    const W = 402, H = 874;
    const fit = () => setScale(Math.min((window.innerWidth - 20) / W, (window.innerHeight - 20) / H, 1.3));
    fit(); window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);

  React.useEffect(() => {
    const el = rootRef.current; if (!el) return;
    const ac = ACCENTS[t.accent] || ACCENTS.Aurora;
    el.style.setProperty('--accent', ac.accent);
    el.style.setProperty('--accent-2', ac.accent2);
    el.style.setProperty('--blob-a', ac.a);
    el.style.setProperty('--blob-b', ac.b);
    el.style.setProperty('--blob-c', ac.c);
    const g = t.glass / 100;
    el.style.setProperty('--glass-blur', (3 + g * 26).toFixed(1) + 'px');
    el.style.setProperty('--glass-sat', (110 + g * 90).toFixed(0) + '%');
    if (t.dark) {
      el.style.setProperty('--glass-bg', `rgba(255,255,255,${(0.03 + g * 0.06).toFixed(3)})`);
      el.style.setProperty('--glass-bg-strong', `rgba(255,255,255,${(0.06 + g * 0.09).toFixed(3)})`);
      el.style.setProperty('--glass-border', `rgba(255,255,255,${(0.07 + g * 0.12).toFixed(3)})`);
    } else {
      el.style.setProperty('--glass-bg', `rgba(255,255,255,${(0.35 + g * 0.30).toFixed(3)})`);
      el.style.setProperty('--glass-bg-strong', `rgba(255,255,255,${(0.55 + g * 0.25).toFixed(3)})`);
      el.style.setProperty('--glass-border', `rgba(255,255,255,${(0.5 + g * 0.4).toFixed(3)})`);
    }
    el.style.setProperty('--glow', (t.glow / 100 * 1.05).toFixed(2));
    el.style.setProperty('--font', FONTS[t.font] || FONTS.System);
    el.style.setProperty('--num-feat', (t.numerals === 'Clean') ? 'normal' : 'tabular-nums');
    el.style.setProperty('--num-font', (t.numerals === 'Mono') ? '"SF Mono", ui-monospace, "Roboto Mono", monospace' : 'var(--font)');
  }, [t]);

  const nav = (id) => setTab(id);

  const screen = () => {
    switch (tab) {
      case 'home': return <HomeScreen nav={nav} theme={theme} toggleTheme={toggleTheme} hideBal={hideBal} setHideBal={setHideBal} onPay={() => setSheet('pay')} />;
      case 'accounts': return <AccountsScreen nav={nav} />;
      case 'transactions': return <TransactionsScreen nav={nav} />;
      case 'cards': return <CardsScreen nav={nav} onPayCard={() => setSheet('pay')} />;
      case 'invest': return <InvestScreen nav={nav} />;
      case 'cibil': return <CreditScoreScreen nav={nav} />;
      case 'ai': return <AIScreen nav={nav} />;
      case 'goals': return <GoalsScreen nav={nav} />;
      case 'analytics': return <AnalyticsScreen nav={nav} />;
      case 'profile': return <ProfileScreen nav={nav} theme={theme} toggleTheme={toggleTheme} onLock={() => setPhase('faceid')} />;
      case 'notifs': return <NotificationsScreen nav={nav} />;
      default: return null;
    }
  };

  return (
    <div ref={rootRef} className={`app-root ${theme === 'light' ? 'theme-light' : ''}`} style={{ background: theme === 'dark' ? 'radial-gradient(130% 120% at 50% 0%, #15161c, #050507 72%)' : 'radial-gradient(130% 120% at 50% 0%, #dfe3ec, #c3c8d4 80%)' }}>
      <div style={{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center' }}>
        <div style={{ transform: `scale(${scale})`, transformOrigin: 'center', transition: 'transform .2s' }}>
          <Frame dark={theme === 'dark'}>
            <div className="ambient"><div className="blob a" /><div className="blob b" /><div className="blob c" /></div>
            <div style={{ position: 'absolute', inset: 0, zIndex: 2 }}>
              {phase === 'splash' && <Splash onNext={() => setPhase('onboard')} />}
              {phase === 'onboard' && <Onboarding onDone={() => setPhase('faceid')} />}
              {phase === 'faceid' && <FaceID onUnlock={() => { setPhase('app'); setTab('home'); }} />}
              {phase === 'app' && (
                <React.Fragment key={tab}>
                  {screen()}
                  <TabBar active={tab} nav={nav} />
                </React.Fragment>
              )}
              {sheet === 'pay' && <PaySheet onClose={() => setSheet(null)} />}
            </div>
          </Frame>
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Look & feel" />
        <TweakSelect label="Accent" value={t.accent} options={Object.keys(ACCENTS)} onChange={(v) => setTweak('accent', v)} />
        <TweakToggle label="Dark mode" value={t.dark} onChange={(v) => setTweak('dark', v)} />
        <TweakSlider label="Glass intensity" value={t.glass} min={0} max={100} unit="%" onChange={(v) => setTweak('glass', v)} />
        <TweakSlider label="Ambient glow" value={t.glow} min={0} max={100} unit="%" onChange={(v) => setTweak('glow', v)} />
        <TweakSection label="Typography" />
        <TweakSelect label="Font" value={t.font} options={Object.keys(FONTS)} onChange={(v) => setTweak('font', v)} />
        <TweakRadio label="Numerals" value={t.numerals} options={['Clean', 'Tabular', 'Mono']} onChange={(v) => setTweak('numerals', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
